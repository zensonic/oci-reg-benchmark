version: "2"

linters:
  default: standard
  enable:
    - bodyclose       # HTTP response bodies must be closed (important for the registry client)
    - errorlint       # correct error wrapping and comparison
    - gocritic
    - misspell
    - revive          # readable names and doc comments
    - unconvert
    - unparam

  exclusions:
    # Ignore unchecked errors from Close on read paths and from printing to
    # the terminal, the standard golangci-lint preset. Closes after writing a
    # file are still checked explicitly in the code.
    presets:
      - std-error-handling
    rules:
      # A Close error in a test cannot change the outcome of the test, and
      # test helpers close response bodies with t.Cleanup.
      - path: _test\.go
        linters: [errcheck, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
