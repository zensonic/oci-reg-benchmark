# GoReleaser builds and publishes the orbctl binaries for a GitHub release.
# The orb container image is built separately in the release workflow.
version: 2

project_name: orbctl

builds:
  - id: orbctl
    main: ./cmd/orbctl
    binary: orbctl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/zensonic/oci-reg-benchmark/internal/version.Version={{ .Version }}
      - -X github.com/zensonic/oci-reg-benchmark/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/zensonic/oci-reg-benchmark/internal/version.Date={{ .CommitDate }}
    # Reproducible builds: file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Software bill of materials for every archive (uses syft).
sboms:
  - artifacts: archive

# Keyless signing of the checksum file with Sigstore cosign.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

changelog:
  # Release notes come from GitHub, grouped by the labels in .github/release.yml.
  use: github-native

release:
  prerelease: auto
