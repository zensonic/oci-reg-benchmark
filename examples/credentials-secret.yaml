# Registry credentials for ORB, as a Secret of type kubernetes.io/dockerconfigjson.
#
# The values below are placeholders. The easiest way to create the Secret is
# with kubectl, which encodes everything for you:
#
#   kubectl create secret docker-registry harbor-credentials \
#     --docker-server=harbor.example.com \
#     --docker-username='robot$bench+orb' \
#     --docker-password='<robot account secret>'
#
# For Harbor, a robot account with push and pull permission on the project
# is enough for most benchmarks. Catalog operations and cleanup through the
# Harbor API need more permissions (see docs/usage.md).
apiVersion: v1
kind: Secret
metadata:
  name: harbor-credentials
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "harbor.example.com": {
          "username": "robot$bench+orb",
          "password": "REPLACE-WITH-THE-ROBOT-ACCOUNT-SECRET"
        }
      }
    }
